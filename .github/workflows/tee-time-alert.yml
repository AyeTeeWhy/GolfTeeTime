name: Golf Tee Time Alerts

on:
  workflow_dispatch:
    inputs:
      force_scan:
        description: "Run Wessinger scan now, regardless of time"
        required: false
        default: false
        type: boolean

  schedule:
    # Run hourly so the monitor can select only the desired 2-hour
    # Eastern-time scan windows itself.
    - cron: "0 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Show run mode
        env:
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan || false }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "force_scan=${FORCE_SCAN}"

      - name: Check tee times - manual forced scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Running FORCED Wessinger scan"
          python monitor.py --force

      - name: Check tee times - manual normal scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Running manual Wessinger scan"
          python monitor.py

      - name: Check tee times - scheduled scan
        if: ${{ github.event_name == 'schedule' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Running scheduled Wessinger scan"
          python monitor.py
