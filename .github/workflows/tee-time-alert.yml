name: Golf Tee Time Alerts

on:
  workflow_dispatch:
    inputs:
      force_scan:
        description: "Run the monitor now even if outside the normal scan window"
        required: false
        default: false
        type: boolean
  schedule:
    # Run hourly; monitor.py performs real scans only at even hours from 6 AM-8 PM ET.
    - cron: '0 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check tee times
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python monitor.py ${{ inputs.force_scan && '--force' || '' }}

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golf-tee-time-debug
          path: debug/
          if-no-files-found: ignore

      - name: Persist alert state
        if: always()
        run: |
          if git status --porcelain | grep -q 'state/availability.sqlite3'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/availability.sqlite3
            git commit -m "Update tee-time alert state" || true
            git pull --rebase origin main || true
            git push || true
          fi
